name: Release Boosted

on:
  workflow_dispatch:
    inputs:
      versioning:
        description: Version increment for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require release signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            KEYCHAIN_PASSWORD \
            TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required release signing secrets: ${missing[*]}" >&2
            echo "Follow README.md and docs/macos-signing.md before running a release." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require the latest default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run releases from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH" --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]]; then
            echo "The selected commit is no longer the tip of $DEFAULT_BRANCH. Run the workflow again." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Calculate release version
        id: version
        env:
          VERSIONING: ${{ inputs.versioning }}
        run: |
          version="$(node .github/scripts/bump-version.mjs "$VERSIONING")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          git diff --check
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Ensure the tag is unused
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            args: --bundles deb,appimage
            rust_targets: ""
          - name: Windows x86_64
            os: windows-latest
            args: --bundles nsis,msi
            rust_targets: ""
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        shell: bash
        env:
          VERSIONING: ${{ inputs.versioning }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          version="$(node .github/scripts/bump-version.mjs "$VERSIONING")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version $EXPECTED_VERSION, got $version." >&2
            exit 1
          fi
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/boosted-signing.keychain-db"
          echo "BUILD_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "BUILD_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "The certificate does not contain a valid Developer ID Application identity." >&2
            exit 1
          fi

          rm -f "$certificate_path"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --ci ${{ matrix.args }}

      - name: Build, sign, and notarize macOS bundle
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --ci ${{ matrix.args }}

      - name: Remove temporary signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${BUILD_CERTIFICATE_PATH:-}" ]]; then
            rm -f "$BUILD_CERTIFICATE_PATH"
          fi
          if [[ -n "${BUILD_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$BUILD_KEYCHAIN_PATH" || true
          fi

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          compression-level: 0
          path: |
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.AppImage.sig
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.app.tar.gz.sig
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.deb.sig
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.exe.sig
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.msi.sig

  build-headless:
    name: Build Linux headless CLI
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        env:
          VERSIONING: ${{ inputs.versioning }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          version="$(node .github/scripts/bump-version.mjs "$VERSIONING")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version $EXPECTED_VERSION, got $version." >&2
            exit 1
          fi
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Build embedded web app and server
        run: |
          pnpm build
          cargo build --locked --release -p boosted-server --features embedded-web

      - name: Package headless CLI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          archive="boosted-$VERSION-linux-x86_64"
          mkdir -p "release-artifacts/$archive"
          cp target/release/boosted-server "release-artifacts/$archive/boosted"
          strip "release-artifacts/$archive/boosted"
          tar -C release-artifacts -czf "release-artifacts/$archive.tar.gz" "$archive"
          rm -r "release-artifacts/$archive"

      - name: Upload headless CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-headless-linux
          if-no-files-found: error
          compression-level: 0
          path: release-artifacts/*.tar.gz

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - build
      - build-headless
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate desktop update manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/generate-update-manifest.mjs release-artifacts "$VERSION" "$TAG" "$REPOSITORY" release-artifacts/latest.json

      - name: Commit and tag the release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSIONING: ${{ inputs.versioning }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" --tags
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$EXPECTED_SHA" ]]; then
            echo "$DEFAULT_BRANCH changed while release builds were running. Run the workflow again." >&2
            exit 1
          fi

          version="$(node .github/scripts/bump-version.mjs "$VERSIONING")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected version $EXPECTED_VERSION, got $version." >&2
            exit 1
          fi

          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock desktop/package.json web/package.json desktop/src-tauri/tauri.conf.json
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Boosted $TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"

      - name: Generate checksums
        run: |
          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          while IFS= read -r -d '' file; do
            checksum="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$checksum" "$(basename "$file")"
          done < <(find release-artifacts -type f -print0 | sort -z) > "$checksum_file"
          mv "$checksum_file" release-artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0 | sort -z)
          gh release create "$TAG" "${files[@]}" \
            --title "Boosted $VERSION" \
            --generate-notes \
            --latest \
            --verify-tag
