<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="A local-first coding workspace for projects, tasks, planning, and Codex chats." />
    <meta name="theme-color" content="#edf0f3" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply before the first paint; runtime listeners keep the preference in sync.
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("boosted.theme") || "system"; } catch {}
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#08090b" : "#edf0f3";
        document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light";
      })();
    </script>
    <meta name="application-name" content="Boosted" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Boosted" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Boosted</title>
  </head>
  <body>
    <div class="ios-status-bar-background" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
